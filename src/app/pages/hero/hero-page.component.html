<h1>{{ name() }}</h1>

<dl>
  <td>Nombre:</td>
  <dd (click)="changeHero()">{{ name() }}</dd>

  <td>Edad:</td>
  <dd (click)="changeAge()">{{ age() }}</dd>

  <td>Método:</td>
  <dd (click)="eliminarHero()">{{ heroDescription() }}</dd>

  <td>Capitalizado:</td>
  <dd> {{ name() | uppercase }} </dd>
</dl>

<button (click)="changeHero()" class="btn btn-primary mx-2">Cambiar nombre</button>
<button (click)="changeAge()" class="btn btn-primary">Cambiar edad</button>
<button (click)="resetForm()" class="btn btn-primary mx-2">Reset</button>
<button (click)="eliminarHero()" class="btn btn-primary mx-2">Eliminar</button>
